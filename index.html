<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
        .hidden { display: none; }
        #log { background: #f4f4f4; padding: 10px; margin-top: 20px; border-radius: 5px; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>🎮 Тест подключения</h1>

    <!-- Экран входа -->
    <div id="auth-screen">
        <h3>Вход / Регистрация</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="handleLogin()">Войти</button>
        <p id="error-msg" style="color:red"></p>
    </div>

    <!-- Экран игры -->
    <div id="game-screen" class="hidden">
        <h3>Привет, <span id="user-name"></span>!</h3>
        <p>Баланс: <b id="user-chips">0</b> фишек</p>
        <p>Роль: <span id="user-role"></span></p>
        <button onclick="handleLogout()" style="background: #dc3545;">Выйти</button>
        
        <hr>
        <h4>Проверка базы данных:</h4>
        <button onclick="checkDB()">Обновить данные из БД</button>
    </div>

    <div id="log">Ожидание действий...</div>

    <script>
        // --- ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ ШАГА 2 ---
        const SUPABASE_URL = 'https://lgvrgxvityaobrqstzzs.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndnJneHZpdHlhb2JycXN0enpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTA0MzUsImV4cCI6MjA5NTAyNjQzNX0.ER8QkSTpVWAYiRXD-d-_d3SoqeQkKsBK04c8RhiOxe8';
        // ------------------------------------------

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const logEl = document.getElementById('log');

        function log(msg) {
            logEl.textContent = msg + '\n' + logEl.textContent;
            console.log(msg);
        }

        // Проверка при загрузке
        async function init() {
            log("Инициализация...");
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showGame(session.user);
            } else {
                log("Сессии нет, показываем вход.");
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            log("Попытка входа...");

            const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
            
            if (error) {
                log("Ошибка: " + error.message);
                document.getElementById('error-msg').textContent = error.message;
            } else {
                log("Успех! Пользователь: " + data.user.email);
                showGame(data.user);
            }
        }

        async function showGame(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('user-name').textContent = user.email;
            
            // Загружаем профиль из БД
            checkDB();
        }

        async function checkDB() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            log("Запрос к таблице profiles...");
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error) {
                log("Ошибка БД: " + error.message);
            } else {
                log("Данные получены успешно!");
                document.getElementById('user-chips').textContent = data.chips;
                document.getElementById('user-role').textContent = data.role || 'user';
                if(!data.name) document.getElementById('user-name').textContent = data.email;
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // Запуск
        init();
    </script>
</body>
</html>
